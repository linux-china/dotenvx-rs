[package]
name = "dotenvx-rs"
version = "0.4.33"
edition = "2024"
authors = ["linux_china <libing.chen@gmail.com>"]
description = "Dotenvx is a Rust command-line/library to encrypt your .env files - limiting their attack vector while retaining their benefits"
keywords = ["dotenv", "dotenvx", "secret", "vault"]
categories = ["command-line-utilities"]
documentation = "https://github.com/linux-china/dotenvx-rs"
readme = "README.md"
homepage = "https://github.com/linux-china/dotenvx-rs"
repository = "https://github.com/linux-china/dotenvx-rs"
license = "MIT"


[[bin]]
name = "dotenvx"
path = "src/main.rs"

[dependencies]
## core and encryption
dotenvy = "0.15.7"
ecies = { version = "0.2.11", default-features = false, features = ["std", "aes-rust"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "critical-section", "ecdsa", "ecdsa-core"] }
sha2 = "0.11"
aes-gcm = "0.11.0"
argon2 = { version = "0.6" }
totp-rs = { version = "6.0", features = ["otpauth", "gen_secret"] }
rand = "0.10"
uuid = { version = "1.26", features = ["v4", "v7"] }
base64ct = "1.8.3"
#keyring = { version = "4.2" }
hex = "0.4.3"
# cli
shlex = "2.0"
rpassword = "7.5.4"
rprompt = "2.2.0"
glob = "0.3"
dirs = "7"
walkdir = "2.5.0"
clap = "4.6"
clap_complete = "4.6"
colored = "3.1"
comfy-table = { version = "8.0", default-features = false }
arboard = { version = "3.7", default-features = false }
# file format
java-properties = "2"
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored_json = "5"
dotenv-linter = { version = "4.0", default-features = false }
dotenv-analyzer = "0.1"
# misc
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
regex = "1.13"
anyhow = "1.0"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json", "platform-verifier"] }
which = "8.0"
symlink = "0.1.0"
url = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false , features = ["wayland-data-control"]}
#openssl = { version = "0.10", features = ["vendored"] }
#libdbus-sys = { version = "0.2.7", features = ["vendored"] }

[[bin]]
name = "mkey"
path = "src/master_key.rs"

[profile.dev]
opt-level = 0
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"

[dev-dependencies]
testresult = "0.4.1"
tempfile = "3.27"
